name: Misk
type: theme
description: 'Basic structure for a Bootstrap SubTheme.'
core_version_requirement: ^10.3 || ^11
base theme: bootstrap

libraries:
  - misk/global-styling

# The bootstrap base theme's "toast" library depends on a library
# named "bootstrap/bootstrap_js" that doesn't exist, so the real
# Bootstrap JS bundle never loads and toast.js throws "bootstrap is
# not defined", which aborts Drupal.attachBehaviors() before Slick/
# Blazy can initialize. Point it at the real library instead.
libraries-override:
  bootstrap/toast:
    dependencies:
      - bootstrap/bootstrap

regions:
  top_header: 'Top header'
  top_header_form: 'Top header form'
  header: Header
  header_form: 'Header form'
  primary_menu: 'Primary menu'
  secondary_menu: 'Secondary menu'
  page_top: 'Page top'
  page_bottom: 'Page bottom'
  highlighted: Highlighted
  featured_top: 'Featured top'
  breadcrumb: Breadcrumb
  content: Content
  sidebar_first: 'Sidebar first'
  sidebar_second: 'Sidebar second'
  featured_bottom_first: 'Featured bottom first'
  featured_bottom_second: 'Featured bottom second'
  featured_bottom_third: 'Featured bottom third'
  footer_first: 'Footer first'
  footer_second: 'Footer second'
  footer_third: 'Footer third'
  footer_fourth: 'Footer fourth'
  footer_fifth: 'Footer fifth'
  none: None

# Information added by Drupal.org packaging script on 2025-06-10
version: '5.0.2'
project: 'bootstrap'
datestamp: 1749514451
